name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild, so the visitors' recipe ratings written into each page's
  # structured data stay current between merges. إعادة بناء أسبوعية للتقييمات.
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A repo named <user>.github.io is served from the root; every other
      # repo is served from /<repo>/, and the build needs the right base.
      - name: Build with the correct base path
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            npm run build -- --base=/
          else
            npm run build -- --base=/${{ github.event.repository.name }}/
          fi

      # The build's pre-render step already wrote dist/<route>/index.html for
      # every address, and dist/404.html for anything else, so Pages serves a
      # 200 where it used to serve 404.html with an HTTP 404.

      # Keep Pages from running Jekyll, which would drop /.well-known files.
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
